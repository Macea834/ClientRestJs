<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <title>Gestión de Productos</title>
</head>
<body>
    <script src="cliente.js"></script>

    <div class="container mt-5">
        <div class="card">
            <h3 class="card-header">Gestión de Productos</h3>
            <div class="card-body">
                <h5 class="card-title">¡Formulario para Registro, Actualización y Eliminación!</h5>
                <p class="card-text">
                    En este formulario puedes registrar un producto, buscarlo por código y nombre para actualizar su información o eliminarlo.
                </p>
                <br>

                <div class="row mb-3">
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="codigo" placeholder="Código" required>
                    </div>
                    <div class="col-md-4">
                        <button type="button" class="btn btn-primary w-100" onclick="consultarProductoPorCodigoYNombre()">Buscar</button>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <input type="text" class="form-control" id="descripcion" placeholder="Descripción" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <input type="number" step="0.01" class="form-control" id="precio" placeholder="Precio" min="0" required>
                    </div>
                </div>

                <div class="row justify-content-end g-2">
                    <div class="col-md-auto">
                        <button type="button" class="btn btn-primary" onclick="registrarProducto()">Guardar</button>
                    </div>
                    <div class="col-md-auto">
                        <button type="button" class="btn btn-success" onclick="actualizarProducto()">Actualizar</button>
                    </div>
                    <div class="col-md-auto">
                        <button type="button" class="btn btn-danger" onclick="eliminarProducto()">Eliminar</button>
                    </div>
                    <div class="col-md-auto">
                        <button type="button" class="btn btn-secondary" onclick="listarProductos()">Listar</button>
                    </div>
                    <div class="col-md-auto">
                        <button type="button" class="btn btn-outline-secondary" onclick="limpiarFormulario()">Limpiar</button>
                    </div>
                </div>

                <div class="mt-4">
                    <table class="table table-sm table-striped">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
